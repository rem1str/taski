volumes:
  pg_data:
  static:
  media:

services:
  db:
    image: postgres:13
    restart: always
    env_file: .env
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    image: rem1strs/taski_backend
    restart: always
    env_file: .env
    command: >
      sh -c "
        python manage.py migrate &&
        python manage.py collectstatic --noinput &&
        gunicorn backend.wsgi:application --bind 0.0.0.0:8000
      "
    volumes:
      - static:/app/collected_static
      - media:/app/media
    expose:
      - 8000
    depends_on:
      db:
        condition: service_healthy

  frontend:
    image: rem1strs/taski_frontend
    command: cp -r /app/build/. /app/collected_static/
    volumes:
      - static:/app/collected_static
    depends_on:
      - backend

  gateway:
    image: rem1strs/taski_gateway
    restart: always
    volumes:
      - static:/usr/share/nginx/html:ro
      - media:/app/media:ro
    ports:
      - "127.0.0.1:8000:80"
    depends_on:
      - backend